pluginManagement {
    repositories {
        // Resolve ModDevGradle from the official Maven repository.
        maven {
            name = 'NeoForged'
            url = 'https://maven.neoforged.net/releases'
        }
        maven {
            name = 'AliyunPublic'
            url = 'https://maven.aliyun.com/repository/public'
        }
        gradlePluginPortal()
    }
}

// 强制所有配置（包括 ModDevGradle 的内部配置）使用这里声明的仓库：本地镜像优先
// Optional local mirror: ./nf-mirror or ../nf-mirror; CI uses remote repositories.
def mirrorCandidates = [new File(rootDir, 'nf-mirror'), new File(rootDir.parentFile, 'nf-mirror')]
def mirrorDir = mirrorCandidates.find { it.isDirectory() }
dependencyResolutionManagement {
    repositoriesMode = RepositoriesMode.PREFER_SETTINGS
    repositories {
        if (mirrorDir != null) {
            maven { url = mirrorDir.toURI() }
        }
        maven {
            name = 'Mojang Minecraft Libraries'
            url = 'https://libraries.minecraft.net'
        }
        mavenCentral()
        maven {
            name = 'Mojang Meta'
            url = 'https://maven.neoforged.net/mojang-meta/'
        }
        maven {
            name = 'NeoForged'
            url = 'https://maven.neoforged.net/releases/'
        }
        maven {
            name = 'FabricMC'
            url = 'https://maven.fabricmc.net/'
        }
        maven {
            name = 'AliyunPublic'
            url = 'https://maven.aliyun.com/repository/public'
        }
    }
}

rootProject.name = 'EverlastGear-26.1.1'
