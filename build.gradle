plugins {
    id 'java'
    id 'net.minecraftforge.gradle' version '6.0.54'
    id 'org.spongepowered.mixin' version '0.7.38'
}
version = "${mod_version}-mc${minecraft_version}-forge"
group = mod_group_id
base { archivesName = mod_id }
java.toolchain.languageVersion = JavaLanguageVersion.of(17)
sourceSets {
    testmod {
        compileClasspath += sourceSets.main.output
        runtimeClasspath += sourceSets.main.output
    }
}
configurations {
    testmodImplementation.extendsFrom implementation
    testmodRuntimeOnly.extendsFrom runtimeOnly
}
minecraft {
    mappings channel: 'official', version: minecraft_version
    copyIdeResources = true
    runs {
        configureEach {
            workingDirectory project.file('run')
            property 'forge.logging.console.level', 'info'
            mods { "${mod_id}" { source sourceSets.main } }
        }
        client { }
        server { args '--nogui' }
        gameTestServer {
            property 'forge.enabledGameTestNamespaces', mod_id
            mods { "${mod_id}_tests" { source sourceSets.testmod } }
        }
    }
}
repositories {
    mavenCentral()
    maven { url = 'https://maven.minecraftforge.net' }
    maven { url = 'https://libraries.minecraft.net' }
    maven {
        url = 'https://repo.spongepowered.org/maven'
        content { includeGroup 'org.spongepowered' }
    }
}
dependencies {
    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"
    annotationProcessor 'org.spongepowered:mixin:0.8.5:processor'
}
mixin {
    add sourceSets.main, 'everlast_gear.refmap.json'
    config 'everlast_gear.mixins.json'
}
def generatedRefmap = layout.buildDirectory.file('tmp/compileJava/compileJava-refmap.json')
tasks.named('compileJava', JavaCompile).configure {
    // MixinGradle's annotation processor output must survive Gradle build caching.
    outputs.file(generatedRefmap)
    outputs.file(layout.buildDirectory.file('tmp/compileJava/compileJava-mappings.tsrg'))
}
tasks.named('processResources', ProcessResources).configure {
    dependsOn tasks.named('compileJava')
    from(generatedRefmap) { rename { 'everlast_gear.refmap.json' } }
    def props = [mod_id: mod_id, mod_version: mod_version, mod_name: mod_name,
                 mod_license: mod_license, minecraft_version: minecraft_version]
    inputs.properties props
    filesMatching('META-INF/mods.toml') { expand props }
}
tasks.named('jar', Jar).configure {
    filesMatching('everlast_gear.refmap.json') { duplicatesStrategy = DuplicatesStrategy.EXCLUDE }
    manifest.attributes('MixinConfigs': 'everlast_gear.mixins.json')
    finalizedBy 'reobfJar'
}
tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8' }
