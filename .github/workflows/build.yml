name: Build

on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Build with Gradle
        run: ./gradlew --no-daemon build --stacktrace

      - name: Verify equipment behavior
        run: ./gradlew --no-daemon runGameTestServer -x downloadAssets --stacktrace

      - name: Verify NeoForge using the Forge-compiled classes
        run: >-
          ./gradlew --no-daemon -Ploader_group=net.neoforged -Pforge_version=47.1.106
          runGameTestServer -x downloadAssets -x compileJava -x processResources
          -x compileTestmodJava -x processTestmodResources --stacktrace

      - name: Upload mod JAR
        uses: actions/upload-artifact@v4
        with:
          name: EverlastGear-1.20.1-Forge-NeoForge
          path: build/libs/*.jar
          if-no-files-found: error
